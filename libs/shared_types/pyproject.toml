[project]
name = "shared_types"
version = "0.1.0"
description = "Shared dataclasses, enums, and interfaces used across the AI-image-detection pipeline (transforms, detection results, dataset manifest, model interfaces)."
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_types"]      
