[project]
name = "Our Classifier"       
version = "0.1.0"
description = "This classifier directly trains off the augmented images in order to determine if the image is AI generated or not."
requires-python = ">=3.11"

dependencies = [
    # runtime deps specific to THIS package only
    # e.g. "torch>=2.2", "transformers", "numpy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_types"]      
