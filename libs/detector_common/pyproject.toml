[project]
name = "detector_common"
version = "0.1.0"
description = "Shared base class and helpers for single-model AI-generated-image detectors."
requires-python = ">=3.11"

dependencies = [
    "pillow>=10.0",
    "shared_types",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector_common"]

[tool.uv.sources]
shared_types = { workspace = true }
