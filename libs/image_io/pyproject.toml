[project]
name = "image_io"
version = "0.1.0"
description = "Reusable image loading and discovery helpers shared across the AI-image-detection pipeline."
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "shared_types",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_io"]

[tool.uv.sources]
shared_types = { workspace = true }
