[project]
name = "data"
version = "0.1.0"
description = "This augments the images using the listed augmentations in the problem statement."
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "datasets>=2.19",
    "shared_types",
    "image_io",
    "boto3>=1.34",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data"]

[tool.uv.sources]
shared_types = { workspace = true }
image_io = { workspace = true }
