[project]
name = "data"
version = "0.1.0"
description = "This augments the images using the listed augmentations in the problem statement."
requires-python = ">=3.11"

dependencies = [
    # runtime deps specific to THIS package only
    # e.g. "torch>=2.2", "transformers", "numpy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data"]      