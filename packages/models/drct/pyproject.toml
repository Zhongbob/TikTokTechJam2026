[project]
name = "drct"
version = "0.1.0"
description = "DRCT (Diffusion Reconstruction Contrastive Training) AI-generated-image detector as a shared_types EnsembleDetector. CLIP-ViT-B/16 or ConvNeXt-Base backbone + linear head."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "open-clip-torch>=2.24",
    "pillow>=10.0",
    "shared_types",
    "detector_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drct"]

[tool.uv.sources]
shared_types = { workspace = true }
detector_common = { workspace = true }
