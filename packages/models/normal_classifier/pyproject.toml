[project]
name = "normal_classifier"
version = "0.1.0"
description = "Baseline real-vs-AI-generated image classifier: Ultralytics YOLO classification fine-tuned on SID-Set. Reference implementation of shared_types.TrainableModel / EnsembleDetector."
requires-python = ">=3.11"

dependencies = [
    "ultralytics>=8.3",
    "pillow>=10.0",
    "shared_types",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normal_classifier"]

[tool.uv.sources]
shared_types = { workspace = true }
