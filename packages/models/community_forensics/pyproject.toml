[project]
name = "community_forensics"
version = "0.1.0"
description = "Community-Forensics deepfake/AI-image detector (ViT) as a shared_types EnsembleDetector. Wraps JeongsooP/Community-Forensics (HF mirror: buildborderless/CommunityForensics-DeepfakeDet-ViT)."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "pillow>=10.0",
    "shared_types",
    "detector_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/community_forensics"]

[tool.uv.sources]
shared_types = { workspace = true }
detector_common = { workspace = true }
