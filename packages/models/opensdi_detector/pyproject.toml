[project]
name = "opensdi_detector"
version = "0.1.0"
description = "OpenSDI / MaskCLIP manipulation-detection model as a shared_types EnsembleDetector. Wraps iamwangyabin/OpenSDI (CLIP + MAE side-adapter, image label + forgery mask)."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pillow>=10.0",
    "huggingface-hub>=0.20",
    # MaskCLIP's model code (loaded from the cloned OpenSDI repo) imports these.
    # IMDLBenCo's own numpy<2 / albumentations==1.3.0 pins are overridden in the
    # root pyproject's [tool.uv] override-dependencies.
    "IMDLBenCo",
    "timm",
    "ftfy",
    "regex",
    "omegaconf",
    "clip",
    "setuptools<81",  # OpenSDI / OpenAI-CLIP import pkg_resources, dropped in setuptools 81 and absent from the 3.14 venv
    "shared_types",
    "detector_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensdi_detector"]

[tool.uv.sources]
shared_types = { workspace = true }
detector_common = { workspace = true }
