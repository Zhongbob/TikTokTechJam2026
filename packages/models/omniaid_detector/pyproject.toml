[project]
name = "omniaid_detector"
version = "0.1.0"
description = "OmniAID universal AI-generated image detector (MoE over DINOv3 / CLIP-ViT-L) as a shared_types EnsembleDetector. Wraps yunncheng/OmniAID (ICML 2026)."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "pillow>=10.0",
    "shared_types",
    "detector_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniaid_detector"]

[tool.uv.sources]
shared_types = { workspace = true }
detector_common = { workspace = true }
