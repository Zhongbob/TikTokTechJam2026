[project]
name = "fusion"
version = "0.1.0"
description = "Fusion detector: combines Community-Forensics (whole-image synthetic) and PSCC-Net (local tamper) into one shared_types EnsembleDetector. Default decider = max of member p(ai) vs a threshold; a trainable meta-classifier is stubbed for later."
requires-python = ">=3.11"

dependencies = [
    "pillow>=10.0",
    "shared_types",
    "detector_common",
    "community_forensics",
    "pscc_net",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion"]

[tool.uv.sources]
shared_types = { workspace = true }
detector_common = { workspace = true }
community_forensics = { workspace = true }
pscc_net = { workspace = true }
