[project]
name = "Ensemble Model"       
version = "0.1.0"
description = "Ensemble Model which combines all listed models"
requires-python = ">=3.11"

dependencies = [
    "data"
    # runtime deps specific to THIS package only
    # e.g. "torch>=2.2", "transformers", "numpy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensemble"]      

[tool.uv.sources]
data = { workspace = true }