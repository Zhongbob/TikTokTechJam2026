[project]
name = "ensemble"
version = "0.1.0"
description = "Ensemble detector: the fusion model + clip_vit_b32 + dinov2 + yolo + swin, combined via detector_common.CombinerDetector (max / mean / weighted / meta). Optional autoencoder restoration for the fusion member."
requires-python = ">=3.11"

dependencies = [
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "detector_common",
    "shared_types",
    "fusion",
    "clip_vit_b32",
    "dinov2",
    "yolo",
    "swin",
    "autoencoder",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensemble"]

[tool.uv.sources]
detector_common = { workspace = true }
shared_types = { workspace = true }
fusion = { workspace = true }
clip_vit_b32 = { workspace = true }
dinov2 = { workspace = true }
yolo = { workspace = true }
swin = { workspace = true }
autoencoder = { workspace = true }
