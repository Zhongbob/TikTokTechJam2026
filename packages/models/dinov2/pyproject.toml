[project]
name = "dinov2"
version = "0.1.0"
description = "In-house fine-tuned DINOv2 real-vs-AI-generated image classifier (HF Dinov2Model backbone + linear head) as a shared_types EnsembleDetector."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "pillow>=10.0",
    "shared_types",
    "detector_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinov2"]

[tool.uv.sources]
shared_types = { workspace = true }
detector_common = { workspace = true }
