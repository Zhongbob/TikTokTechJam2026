[project]
name = "swin"
version = "0.1.0"
description = "Swin-Tiny real-vs-AI-generated image classifier (inference) as a shared_types EnsembleDetector. Loads the .pth produced by s3_swin_transformer_streaming.ipynb (microsoft/Swin-Transformer)."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9,<2",
    "pillow>=10.0",
    "shared_types",
    "detector_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swin"]

[tool.uv.sources]
shared_types = { workspace = true }
detector_common = { workspace = true }
