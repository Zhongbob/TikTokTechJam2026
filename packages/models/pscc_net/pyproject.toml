[project]
name = "pscc_net"
version = "0.1.0"
description = "PSCC-Net (Progressive Spatio-Channel Correlation Network) image-manipulation detection + localization, wrapped as a shared_types EnsembleDetector. HRNet-W18-small backbone -> non-local localization head + binary detection head. Vendored from proteus1991/PSCC-Net (MIT)."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
    "shared_types",
    "detector_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pscc_net"]

[tool.uv.sources]
shared_types = { workspace = true }
detector_common = { workspace = true }
