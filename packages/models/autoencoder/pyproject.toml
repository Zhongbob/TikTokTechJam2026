[project]
name = "autoencoder"
version = "0.1.0"
description = "Autoencoder for reversing augmentation damage on images. Reference implementation of shared_types.TrainableModel / AutoencoderRestorer."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "pillow>=10.0",
    "numpy>=1.26",
    "shared_types",
    "data",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoencoder"]

[tool.uv.sources]
shared_types = { workspace = true }
data = { workspace = true }
