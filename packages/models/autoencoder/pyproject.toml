[project]
name = "autoencoder"
version = "0.1.0"
description = "This autoencoder transforms the augmented image back into it's original form to the best of it's ability."
requires-python = ">=3.11"

dependencies = [
    "data"
    # runtime deps specific to THIS package only
    # e.g. "torch>=2.2", "transformers", "numpy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoencoder"]      

[tool.uv.sources]
data = { workspace = true }