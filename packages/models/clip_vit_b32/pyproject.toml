[project]
name = "clip_vit_b32"
version = "0.1.0"
description = "In-house fine-tuned OpenAI CLIP ViT-B/32 real-vs-AI-generated image classifier (prompt-similarity head) as a shared_types EnsembleDetector."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ftfy>=6.0",
    "regex>=2023.0",
    "pillow>=10.0",
    # The model backbone is OpenAI CLIP, which isn't published on PyPI as `clip`
    # — pulled straight from GitHub (see [tool.uv.sources] below). Imported
    # lazily; from_checkpoint raises a clear error if it's somehow missing.
    "clip",
    "shared_types",
    "detector_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clip_vit_b32"]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
shared_types = { workspace = true }
detector_common = { workspace = true }
