[project]
name = "clip_vit_b32"
version = "0.1.0"
description = "In-house fine-tuned OpenAI CLIP ViT-B/32 real-vs-AI-generated image classifier (prompt-similarity head) as a shared_types EnsembleDetector."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ftfy>=6.0",
    "regex>=2023.0",
    "pillow>=10.0",
    "shared_types",
    "detector_common",
]

# The model backbone is OpenAI CLIP, which is not on PyPI as `clip`:
#   pip install git+https://github.com/openai/CLIP.git
# (imported lazily; from_checkpoint raises a clear error if it's missing.)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clip_vit_b32"]

[tool.uv.sources]
shared_types = { workspace = true }
detector_common = { workspace = true }
