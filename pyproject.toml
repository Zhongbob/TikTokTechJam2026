[project]
name = "tiktoktechjam2026"
version = "0.1.0"
description = "AI-generated image detection ensemble, robust to real-world transformations."
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/models/*",
    "packages/data",
    "libs/*"
]

[tool.uv.sources]
# OpenAI CLIP backbone for clip_vit_b32 (and the OpenSDI fusion member) — not on PyPI.
clip = { git = "https://github.com/openai/CLIP.git" }

[tool.uv]
# IMDLBenCo (an OpenSDI / fusion-member dep) pins numpy<2 and albumentations==1.3.0,
# which have no wheels for the Python used here (3.14) and would need a C compiler
# to build. Both pins are over-conservative for MaskCLIP *inference*; override them
# with the modern versions the rest of the workspace already uses.
override-dependencies = [
    "numpy>=2.1",
    "albumentations>=1.4",
]
