[project]
name = "TikTokTechJam Bums"       
version = "0.1.0"
description = "Bums"
requires-python = ">=3.11"

dependencies = [
    "ensemble",
    "data"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web"]      

[tool.uv.sources]
ensemble = { workspace = true }
data = { workspace = true }