[project]
name = "web"
version = "0.1.0"
description = "Streamlit demo UI for the AI-generated-image detection pipeline."
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.37,<2",
    "pillow>=10.0",
    "numpy>=1.26",
    "shared_types",
    "normal_classifier",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web"]

[tool.uv.sources]
shared_types = { workspace = true }
normal_classifier = { workspace = true }